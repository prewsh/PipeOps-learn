name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # The five suites in scripts/verify-*.mjs authenticate as real participants
  # against a live Supabase project, so they need project secrets and a running
  # app. They are not run here: pointing public CI at the live cohort database
  # would mean creating and deleting real rows on every pull request.
  #
  # Run them from a machine with .env.local before deploying — docs/DEPLOYMENT.md
  # section 5 — or wire this job to a dedicated staging project:
  #
  #   for s in p1 p2 p3 auth security; do node scripts/verify-$s.mjs || exit 1; done
